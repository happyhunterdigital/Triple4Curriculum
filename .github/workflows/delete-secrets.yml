name: Delete Secret Manager secrets

# One-off cleanup. Deletes secrets by name (never reads values). Stripe keys
# were removed after the PayFast migration; usage:
#   gh workflow run delete-secrets.yml -f SECRET_NAMES=STRIPE_SECRET,STRIPE_WEBHOOK_SECRET

on:
  workflow_dispatch:
    inputs:
      SECRET_NAMES:
        description: 'Comma-separated secret names to delete'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install google-auth-library
        run: npm install --no-save google-auth-library

      - name: Delete secrets
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_PROJECT: triple4curriculum
          SECRET_NAMES: ${{ inputs.SECRET_NAMES }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          node scripts/delete-secrets.mjs
