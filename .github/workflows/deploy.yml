name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual runs deploy Firestore rules + indexes too (see the gated step below).
  # Use this AFTER scripts/set-claims.mjs has been run for every staff account:
  # the rules are claims-only and will otherwise lock signed-in users out.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: gitleaks on pull_request scans a commit range
          # (SHA^..SHA) which fails on shallow clones ("unknown revision").
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint (tsc --noEmit)
        run: bun run lint

      - name: Tests (vitest)
        run: bun run test

      - name: Build project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'triple4curriculum' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        run: bun run build

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Single build artifact: build once in verify, reuse downstream.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  build_and_deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifact (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: triple4curriculum

      # The w9jds docker action has no npm, so the firebase.json predeploy build
      # ("npm --prefix $RESOURCE_DIR run build") exits 127. Run the Firebase CLI
      # directly on the runner instead, where Node/npm are available.
      - name: Setup Node (functions runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Deploy Cloud Functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          npx --yes firebase-tools@latest functions:list --project triple4curriculum --non-interactive --debug
          npx --yes firebase-tools@latest deploy --only functions --project triple4curriculum --non-interactive

      # Claims-only rules: deploying these before custom claims exist locks every
      # signed-in user out. They therefore only deploy on a manual workflow run,
      # after scripts/set-claims.mjs has been executed against the project.
      - name: Deploy Firestore rules + indexes (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project triple4curriculum --non-interactive
