<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>export</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<!-- Local render helper: ?src=hh-x.html&w=<mm>&h=<mm>&p=<page-number>.
     The artboard itself reads ?export=1 and ?p= (see the helper script at
     the end of each artboard), so this frame only sizes the viewport. -->
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("src") || "t4c-letterhead-a4.html";
  const w = q.get("w") || "210";
  const h = q.get("h") || "297";
  const sep = src.includes("?") ? "&" : "?";
  const f = document.createElement("iframe");
  f.src = src + sep + "export=1" + (q.get("p") ? "&p=" + q.get("p") : "");
  f.style.width = w + "mm";
  f.style.height = h + "mm";
  document.body.appendChild(f);
</script>
</body>
</html>
