<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crest</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
  // Local build helper. Key out the flat white backdrop of the official crest
  // PNG so the mark can sit on cream, green or black stock. Pure canvas, no
  // third-party requests.
  const img = new Image();
  img.src = "assets/t4c-crest.png";
  img.onload = () => {
    const c = document.getElementById("c");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    const px = d.data;
    let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const w = Math.min(r, g, b);
      // fully transparent above 248, fully opaque below 240
      let a = Math.round(Math.max(0, Math.min(1, (248 - w) / 8)) * 255);
      px[i + 3] = a;
      if (a > 8) {
        const p = i / 4, x = p % c.width, y = Math.floor(p / c.width);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    ctx.putImageData(d, 0, 0);

    // The source has a soft drop shadow. Find the crest's own outer ring
    // (green or gold pixels) and cut everything beyond it, so the mark has
    // clean edges on any stock.
    let cx = 0, cy = 0, n = 0;
    const strong = [];
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 200) continue;
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const green = g > r + 18 && g > b + 18;
      const gold = r > 170 && g > 130 && b < 120;
      if (green || gold) {
        const p = i / 4, x = p % c.width, y = Math.floor(p / c.width);
        cx += x; cy += y; n++;
        strong.push(Math.hypot(x, y));
      }
    }
    if (n) {
      cx /= n; cy /= n;
      // The outer gold rim is the true edge of the crest, so use the furthest
      // gold pixel as the radius and cut everything beyond it.
      let radius = 0;
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] < 200) continue;
        const r = px[i], g = px[i + 1], b = px[i + 2];
        const gold = r > 150 && g > 105 && b < 130 && r > b + 60;
        if (!gold) continue;
        const p = i / 4, x = p % c.width, y = Math.floor(p / c.width);
        const dist = Math.hypot(x - cx, y - cy);
        if (dist > radius) radius = dist;
      }
      radius = Math.round(radius) + 1;
      for (let i = 0; i < px.length; i += 4) {
        const p = i / 4, x = p % c.width, y = Math.floor(p / c.width);
        if (Math.hypot(x - cx, y - cy) > radius) px[i + 3] = 0;
      }
      ctx.putImageData(d, 0, 0);
      // re-trim
      minX = c.width; minY = c.height; maxX = 0; maxY = 0;
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] > 8) {
          const p = i / 4, x = p % c.width, y = Math.floor(p / c.width);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    // trim to the visible mark
    const pad = 2;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
    const w = maxX - minX + 1, h = maxY - minY + 1;
    const t = document.createElement("canvas");
    t.width = w; t.height = h;
    t.getContext("2d").drawImage(c, minX, minY, w, h, 0, 0, w, h);
    document.body.innerHTML = "";
    document.body.appendChild(t);
    document.title = "BBOX " + w + "x" + h;
  };
</script>
</body>
</html>
